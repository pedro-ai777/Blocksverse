function autoSrv(m){for(let k=1;k<=NSRV;k++)if(cnt(m+'-'+k)<MAXP)return k;return 0}
function toast(t){let e=$('toast');if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e)}e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,2500)}
function openServers(m){const s=$('srv');s.innerHTML='';s.style.display='flex';const c=document.createElement('div');c.className='sc';
 const h=document.createElement('div');h.className='sec';h.textContent='Servidores · '+MAPS[m].n+' (máx. '+MAXP+' jogadores)';
 const a=document.createElement('button');a.className='b sel';a.textContent='⚡ Entrar automaticamente';a.onclick=()=>{s.style.display='none';startGame(m)};
 const x=document.createElement('button');x.className='b';x.textContent='Fechar';x.onclick=()=>s.style.display='none';c.append(h,a,x);
 for(let k=1;k<=NSRV;k++){const n=cnt(m+'-'+k),f=n>=MAXP,r=document.createElement('div');r.className='fr';
  r.innerHTML='<div class="fn"><b>Servidor '+k+'</b><small>'+n+'/'+MAXP+' jogadores'+(f?' · Cheio':'')+'</small></div>';
  const b=document.createElement('button');b.className='b'+(f?'':' sel');b.textContent=f?'Cheio':'Entrar';b.disabled=f;b.onclick=()=>{s.style.display='none';startGame(m,k)};r.appendChild(b);c.appendChild(r)}
 s.appendChild(c)}
function joinAuto(m){const s=autoSrv(m);if(!s){toast('Todos os servidores estão cheios');return}tx({t:'b'});SRV=s;loadMap(m);$('mn').textContent=NAME+' · Servidor '+SRV}
function whereF(n){const r=Object.values(R).find(x=>x.n==n);return r?r.room:(WHO[n]||null)}
function where(n){const w=whereF(n);if(!w)return'';const p=w.split('-');return (MAPS[p[0]]?MAPS[p[0]].n:'?')+' · Servidor '+p[1]}
function joinFriend(n){const w=whereF(n);if(!w){toast('Amigo não encontrado');return}const p=w.split('-').map(Number);if(cnt(w)>=MAXP){toast('O servidor do amigo está cheio');return}startGame(p[0],p[1])}
$('bsv').onclick=()=>{$('maps').style.display='none';openServers(MAPI)};
$('zi').onclick=()=>{dist=Math.max(3,dist-3)};$('zo').onclick=()=>{dist=Math.min(40,dist+3)};
const ACC=()=>{try{return JSON.parse(localStorage.getItem('bvacc')||'{}')}catch(e){return{}}},setACC=a=>{try{localStorage.setItem('bvacc',JSON.stringify(a))}catch(e){}};
let U=null,AM='login';
async function sha(s){if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('bv:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=5381;for(const ch of s)h=(h*33^ch.charCodeAt(0))>>>0;return 'x'+h}
function saveAcc(){if(!U)return;const a=ACC();if(a[U]){a[U].C=C;a[U].S=S;a[U].f=F;setACC(a)}}
function authMode(m){AM=m;$('atl').classList.toggle('on',m=='login');$('atr').classList.toggle('on',m=='reg');$('ago').textContent=m=='login'?'Entrar':'Criar conta';$('amsg').textContent=''}
function loginAs(k){const a=ACC()[k];if(!a)return;U=k;if(a.C)Object.assign(C,a.C);if(a.S)Object.assign(S,a.S);if(a.f!=null)F=a.f;NAME=a.n;
 try{localStorage.setItem('bvsess',k);FR=JSON.parse(localStorage.getItem('bvfr_'+k)||'[]')}catch(e){FR=[]}
 $('auth').style.display='none';$('apw').value='';['name','name2'].forEach(i=>{$(i).value=NAME;$(i).readOnly=true});
 document.querySelectorAll('#cols input').forEach((el,i)=>el.value=C[PARTS[i][0]]);
 [...document.querySelectorAll('#sty select')].forEach((el,i)=>el.value=S[['hr','ht','sh','bt'][i]]);$('face').value=F;setAv();tab(0)}
$('atl').onclick=()=>authMode('login');$('atr').onclick=()=>authMode('reg');
$('ago').onclick=async()=>{const u=$('aun').value.trim(),p=$('apw').value,k=u.toLowerCase(),m=$('amsg');
 if(!/^[A-Za-z0-9_]{3,16}$/.test(u)){m.textContent='Usuário: 3 a 16 letras, números ou _';return}
 if(p.length<4){m.textContent='Senha: mínimo de 4 caracteres';return}
 const a=ACC(),h=await sha(k+':'+p);
 if(AM=='reg'){if(a[k]){m.textContent='Esse usuário já existe';return}a[k]={n:u,h,C,S,f:F};setACC(a)}
 else if(!a[k]||a[k].h!==h){m.textContent='Usuário ou senha incorretos';return}
 loginAs(k)};
$('apw').addEventListener('keydown',e=>{if(e.key=='Enter')$('ago').click()});
$('lo').onclick=()=>{try{localStorage.removeItem('bvsess')}catch(e){}U=null;$('apw').value='';$('amsg').textContent='';$('auth').style.display='flex'};
try{const sk=localStorage.getItem('bvsess');if(sk&&ACC()[sk])loginAs(sk)}catch(e){}
$('name').value=NAME;let spin=false;$('spin').onclick=()=>{spin=!spin;$('spin').textContent='↻ Girar boneco: '+(spin?'ligado':'desligado')};
PARTS.forEach(([k,l])=>{const d=document.createElement('div');d.innerHTML=l+'<br>';const i=document.createElement('input');i.type='color';i.value=C[k];
 i.oninput=()=>{C[k]=i.value;setAv()};d.appendChild(i);$('cols').appendChild(d)});
FACES.forEach((f,i)=>{const o=document.createElement('option');o.value=i;o.textContent=f;$('face').appendChild(o)});
$('face').value=F;$('face').onchange=e=>{F=+e.target.value;setAv()};
const HAIR=['Sem cabelo','Curto','Longo','Moicano','Coque'],HAT=['Sem chapéu','Boné','Cartola','Gorro','Coroa'],SHIRT=['Blocksverse','Blusa','Terno','Sem camisa'],BOT=['Sem calça','Shorts','Calça'];
[['hr','Cabelo',HAIR],['ht','Chapéu',HAT],['sh','Camisa',SHIRT],['bt','Calça',BOT]].forEach(([k,l,a])=>{const d=document.createElement('div');d.innerHTML='<label>'+l+'</label>';const e=document.createElement('select');e.style.cssText='width:100%;padding:3px';
 a.forEach((t,i)=>{const o=document.createElement('option');o.value=i;o.textContent=t;e.appendChild(o)});e.value=S[k];e.onchange=()=>{S[k]=+e.value;setAv()};d.appendChild(e);$('sty').appendChild(d)});
$('name').oninput=e=>{NAME=e.target.value.slice(0,16)||'Player';$('name2').value=e.target.value;setAv()};
document.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{if(playing){joinAuto(+b.dataset.m);$('maps').style.display='none'}else loadMap(+b.dataset.m)}));
function startGame(m,srv){if(!U){$('auth').style.display='flex';return}if(m==null)m=MAPI;if(!srv)srv=autoSrv(m);if(!srv){toast('Todos os servidores estão cheios');return}if(cnt(m+'-'+srv)>=MAXP){toast('Servidor cheio');return}SRV=srv;loadMap(m);NAME=($('name').value.trim()||NAME).slice(0,16);setAv();
 saveAcc();
 $('menu').style.display='none';document.body.classList.add('play');$('mn').textContent=NAME+' · Servidor '+SRV;playing=true;resize();yaw=0;pit=.45;dist=14;resetP()}
$('play').onclick=()=>startGame();$('pl2').onclick=()=>startGame();
function openMenu(){tx({t:'b'});playing=false;if(lock)setLock(false);document.body.classList.remove('play','typing');$('menu').style.display='flex';$('chat').style.display=$('maps').style.display='none';resize();tab(1)}
$('bx').onclick=openMenu;

/* ---------- Controles ---------- */
function setLock(v){lock=v;$('lk').classList.toggle('sel',v);try{if(v&&!document.body.classList.contains('touch')){const r=cv.requestPointerLock();if(r&&r.catch)r.catch(()=>{})}else if(document.pointerLockElement)document.exitPointerLock()}catch(e){}}
$('lk').addEventListener('pointerdown',e=>{e.preventDefault();setLock(!lock)});
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&lock&&!document.body.classList.contains('touch'))setLock(false)});
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if((e.code=='ShiftLeft'||e.code=='ShiftRight')&&playing&&!e.repeat)setLock(!lock);keys[e.code]=1;if(playing&&e.code=='Space')e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=0});
let drag=false;
cv.addEventListener('mousedown',()=>drag=true);addEventListener('mouseup',()=>drag=false);
addEventListener('mousemove',e=>{if(!drag&&!(lock&&document.pointerLockElement))return;yaw-=e.movementX*.006;if(playing)pit=Math.max(-1.3,Math.min(1.4,pit+e.movementY*.006))});
cv.addEventListener('wheel',e=>{dist=Math.max(3,Math.min(40,dist+e.deltaY*.02))});
cv.addEventListener('contextmenu',e=>e.preventDefault());
const jb=$('joy'),kn=$('knob');let jid=null,cid=null,pid=null,lx=0,ly=0;
function jmove(t){const r=jb.getBoundingClientRect(),R0=r.width/2;let dx=t.clientX-r.left-R0,dy=t.clientY-r.top-R0;const l=Math.hypot(dx,dy);
 if(l>R0){dx*=R0/l;dy*=R0/l}jx=dx/R0;jy=dy/R0;kn.style.transform=`translate(${dx}px,${dy}px)`}
addEventListener('touchstart',e=>{const ae=document.activeElement;if(e.target===cv&&ae&&ae.tagName=='INPUT')ae.blur();if(!playing){for(const t of e.changedTouches)if(t.target===cv&&cid==null){cid=t.identifier;lx=t.clientX;ly=t.clientY}return}for(const t of e.changedTouches){const el=t.target;
 if(jb.contains(el)){jid=t.identifier;jmove(t)}
 else if(el.id=='jump'){pid=t.identifier;jmp=true}
 else if(el===cv&&t.clientX>innerWidth/2&&cid==null){cid=t.identifier;lx=t.clientX;ly=t.clientY}}
 if(e.target===cv||jb.contains(e.target)||e.target.id=='jump')e.preventDefault()},{passive:false});
addEventListener('touchmove',e=>{if(playing&&e.touches.length==2&&e.touches[0].target===cv&&e.touches[1].target===cv){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pd)dist=Math.max(3,Math.min(40,dist-(d-pd)*.06));pd=d}for(const t of e.changedTouches){
 if(t.identifier===jid)jmove(t);
 else if(t.identifier===cid){yaw-=(t.clientX-lx)*.008;if(playing)pit=Math.max(-1.3,Math.min(1.4,pit+(t.clientY-ly)*.008));lx=t.clientX;ly=t.clientY}}
 if(playing&&e.target===cv)e.preventDefault()},{passive:false});
const tend=e=>{pd=null;for(const t of e.changedTouches){
 if(t.identifier===jid){jid=null;jx=jy=0;kn.style.transform=''}
 if(t.identifier===cid)cid=null;if(t.identifier===pid){pid=null;jmp=false}}};
addEventListener('touchend',tend);addEventListener('touchcancel',tend);

/* ---------- Loop ---------- */
setAv();loadMap(0);resize();tab(0);
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000||.016);last=now;
 if(playing){phys(dt);sendState(now)}else{if(spin)yaw+=dt*.6;me.sp=0}
 me.g.position.set(me.x,me.y,me.z);me.g.rotation.y=playing?me.ry:0;animAv(me.g,me.sp,me.ph,!me.gr&&playing);
 if(me.bub&&now>me.exp){me.g.remove(me.bub);me.bub=null}
 for(const id in R){const r=R[id];if(r.last&&now-r.last>4000){dropR(id);continue}
  r.g.visible=r.room===roomId();const px=r.g.position.x,pz=r.g.position.z;
  r.g.position.lerp(r.tp,Math.min(1,dt*10));
  const v=Math.hypot(r.g.position.x-px,r.g.position.z-pz)/dt/16;r.sp+=(Math.min(1,v)-r.sp)*Math.min(1,dt*10);r.ph+=dt*r.sp*11;
  let d=r.ry-r.g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));r.g.rotation.y+=d*Math.min(1,dt*12);
  animAv(r.g,r.sp,r.ph,Math.abs(r.g.position.y-r.tp.y)>.4);
  if(r.bub&&now>r.exp){r.g.remove(r.bub);r.bub=null}}
 const L_=playing&&lock,dd=playing?dist:10,pp=playing?pit:.2,tx_=me.x+(L_?Math.cos(yaw)*2:0),ty=me.y+3.2,tz=me.z+(L_?-Math.sin(yaw)*2:0);
 const d2=pp<0?Math.max(1.5,Math.min(dd,(ty-me.y-.5)/Math.sin(-pp))):dd;camera.position.set(tx_+Math.sin(yaw)*Math.cos(pp)*d2,Math.max(.4,ty+Math.sin(pp)*d2),tz+Math.cos(yaw)*Math.cos(pp)*d2);
 camera.lookAt(tx_,ty,tz);renderer.render(scene,camera)}
requestAnimationFrame(loop);
</script></body></html>
